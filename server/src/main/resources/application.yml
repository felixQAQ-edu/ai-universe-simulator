spring:
  application:
    name: ai-universe-simulator-server
  # ── ADR-025 刀 1:默认 profile 不起任何 DB 自动配置 ──────────────────────────
  # JDBC / Flyway 依赖进了 classpath 之后,DataSource 自动配置会在默认 profile 下
  # 尝试建连接并失败(ServerApplicationTests 首个变红)。这里排除两项,其余 JDBC 自动
  # 配置(JdbcTemplate / 事务管理器 / db 健康检查 / 连接池指标)都条件于 DataSource bean,
  # 随之自动退场。pg profile(application-pg.yml)把本列表清空。
  # 类名按 Spring Boot 4.1 模块化后的包名(spring-boot-jdbc / spring-boot-flyway 的
  # AutoConfiguration.imports 核过),不是凭记忆写的。
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

server:
  port: 8080

# ── 平台探针 + 部署身份(ADR-015 Slice 3):actuator 只开 health 与 info ────────
# liveness  = GET /actuator/health/liveness (进程活着)
# readiness = GET /actuator/health/readiness(可接流量)
# 平台不分两组探针时用 GET /actuator/health 即可。
#
# info = GET /actuator/info,回「线上跑的是哪个 commit」(build.commit,构建期由
# -Dgit.sha 注入,见 server/pom.xml)。这个坑已摔过两次(runbook §3.1.5 / §3.1.6),
# 此前唯一的取证手段是比对前端 bundle 哈希 / 翻启动日志。
# 暴露清单**只加 info 一项**:env / configprops / beans 才是真暴露面,一律不开。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    # 只放构建信息(版本/时间/commit);env 贡献者保持关闭,免得把配置泄露出去。
    build:
      enabled: true
    env:
      enabled: false

# ── 运行模型 provider 配置表(ADR-001 §5.1 的 Java 落地)──────────────────────
# 换 provider 只改这张表。真实 API key 永远只进环境变量(api-key-env 指向变量名),
# 绝不写进本文件 / 代码 / 提交(CONTEXT §三.2、ADR-002)。
#
# active 取值:
#   mock              → MockLlmClient,离线逐字 echo,不读 key、不发真实请求(默认 / 回退)
#   deepseek-v4-flash → OpenAiCompatLlmClient,调真实 DeepSeek(需 DEEPSEEK_API_KEY 环境变量)
#                       ⚠️ 这是 provider 的配置 key,不是模型 ID —— 实际请求的模型见该条目的 model。
# 切真实模型:把 active 改成 deepseek-v4-flash 并 export DEEPSEEK_API_KEY=<key> 后再启动。
aiuniverse:
  # ── 会话落盘(ADR-015 C3:每 saveId 一个 JSON,最小续局)────────────────────
  # 默认 ./data 本地友好;部署时用环境变量 AIUNIVERSE_SESSION_STORE_DIR 覆盖到
  # 持久卷挂载点(如 /data)。目录必须在 web 根之外(启动断言,违者拒启)。
  session:
    store-dir: ./data
  # ── 回合执行轨迹(ADR-031 刀 3)──────────────────────────────────────────
  # 每局一个 <saveId>.trace.jsonl,每个已落地回合追加一行。目录默认 = 存档目录下的 traces/
  # (线上 AIUNIVERSE_SESSION_STORE_DIR=/data → /data/traces);子目录不进存档回载的扫描面(W-3)。
  # 同受「web 根之外」启动断言。上限到了只停写 + WARN 一次,不自动删除(W-7);清理见 runbook「回合轨迹」。
  # env:AIUNIVERSE_TRACE_ENABLED(=false 应急关闭)/ AIUNIVERSE_TRACE_DIR /
  #      AIUNIVERSE_TRACE_MAX_FILE_BYTES / AIUNIVERSE_TRACE_MAX_TOTAL_BYTES
  trace:
    enabled: true
    dir: ${aiuniverse.session.store-dir}/traces
    max-file-bytes: 5242880      # 5 MB ≈ 460 回合
    max-total-bytes: 209715200   # 200 MB
  # ── 回合并发准入(ADR-022):同时在途的回合数上限 ─────────────────────────
  # SSE 回合是阻塞长连接(线上实测 ~15s),假想敌不是高 QPS,是一个 15 秒不还的线程 ——
  # 故闸装在「同时占用」上,不在「每秒请求」上。可 env 覆盖
  # (AIUNIVERSE_TURN_MAX_CONCURRENT);压到 1 是刀 3 冒烟唯一能确定性触发拒绝的手段。
  # ⚠️ 它只负责 turn 路径上的「不死」,成本仍归下面的 quota 闸,两道闸不互相替代。
  turn:
    max-concurrent: 8
  # ── 开局并发准入(ADR-030 决策 2 / 已决 4)─────────────────────────────────
  # 默认 4,无实测依据(并发开局从未观察到);与回合准入分开(决策 3)。
  # env 覆盖:规范写法 AIUNIVERSE_INIT_MAXCONCURRENT;AIUNIVERSE_INIT_MAX_CONCURRENT 经 Spring 的
  # legacy 下划线映射同样生效(2026-10-06 绑定实验 + InitPropertiesEnvBindingTest 实测)。
  init:
    max-concurrent: 4
  # ── world-gen 流式段时限(ADR-030 决策 4 / 已决 2)────────────────────────
  # 主调用与修复调用各一段、各自独立计时;过线 → 502 world_gen_failed,不建 session。
  # 180 s 无实测依据(先宽后收,收紧以 [world-gen] durMs 日志读数为依据)。
  # env 覆盖:规范写法 AIUNIVERSE_WORLDGEN_SEGMENTDEADLINEMS;AIUNIVERSE_WORLD_GEN_SEGMENT_DEADLINE_MS 经 Spring 的
  # legacy 下划线映射同样生效(2026-10-06 ADR-030 刀 2 绑定实验实测)。
  world-gen:
    segment-deadline-ms: 180000
  # ── 成本闸门四阈值(ADR-016;Felix 拍板,基于线上真实 usage + 52% 缓存命中率)────
  # 全部可 env 覆盖(如 AIUNIVERSE_QUOTA_DAILY_BUDGET_CNY),冒烟压低阈值 = 临时 env。
  # 日界线 = 北京时间;阈值哲学:假想敌是脚本刷不是真人玩,宽到真人永远撞不到。
  quota:
    daily-budget-cny: 6        # 全局日限额 CNY(真闸)
    monthly-budget-cny: 175    # 全局月顶 CNY(真闸)
    init-per-key-daily: 10     # 单 IP/设备日 init 局数(软闸)
    turns-per-key-daily: 300   # 单 IP/设备日回合数(软闸)
  llm:
    active: mock
    providers:
      # key 是内部配置名,保留旧名以免部署时改 fly secret(AIUNIVERSE_LLM_ACTIVE=deepseek-v4-flash);
      # 实际模型见 model。2026-09-10 起 deepseek-v4-flash 由 V4.1-Flash 应答,正式 ID 为
      # deepseek-flash(F-036;Felix 2026-10-06 据官网价格页与平台用量页核实)。
      deepseek-v4-flash:
        label: "DeepSeek V4.1-Flash(非思考)"
        base-url: https://api.deepseek.com
        model: deepseek-flash
        api-key-env: DEEPSEEK_API_KEY
        # V4.1-Flash 默认思考模式;false → ThinkingAdapter 显式发 thinking.type=disabled。
        # 是否真关上看 usage 日志行的 reasoningChars(应为 0)。
        thinking: false
        max-context: 1000000
        # CNY / 1M tokens。取高峰档,宁可多算;不实现分时计价;核实日期 2026-10-06
        # (V4.1-Flash 空闲 / 高峰:命中 0.02 / 0.04、未命中 1 / 2、输出 4 / 8)。
        # 旧值(1.0 / 0.02 / 2.0,V4-Flash)自 2026-09-10 起少算,见 F-036。
        price:
          input-cache-miss: 2.0
          input-cache-hit: 0.04
          output: 8.0
