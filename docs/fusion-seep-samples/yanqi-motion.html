<title>验讫动效演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --shell:#f1eff4; --panel:#ffffff; --ink:#1c1822; --ink-soft:#6b6375; --rule:#dcd9e2; --mark:#3c5a50; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shell:#0c0a10; --panel:#1b1722; --ink:#ece9f1; --ink-soft:#9a93a6; --rule:#2f2a39; --mark:#8fb3a4; color-scheme: dark; } }
:root[data-theme="dark"] { --shell:#0c0a10; --panel:#1b1722; --ink:#ece9f1; --ink-soft:#9a93a6; --rule:#2f2a39; --mark:#8fb3a4; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--shell); color: var(--ink); font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; line-height: 1.5;
  padding-block: 1.5rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
.head h1 { margin: 0; font-size: 1.35rem; } .head p { margin: 0.35rem 0 0; color: var(--ink-soft); font-size: 0.9rem; max-width: 64ch; }
.bench { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
.stageCol { flex: 0 1 377px; min-width: 0; } .notes { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 1rem; }
.box { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 0.9rem 1rem; }
.box h2 { margin: 0 0 0.6rem; font-size: 0.95rem; } .box ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.86rem; }
.btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.btns button { font: inherit; font-size: 0.82rem; padding: 0.4rem 0.75rem; background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
.btns button:focus-visible, input:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
.knobs { display: flex; flex-direction: column; gap: 0.65rem; }
.knob { display: grid; grid-template-columns: 7.5rem 1fr 4.4rem; gap: 0.6rem; align-items: center; font-size: 0.82rem; }
.knob input { width: 100%; min-width: 0; accent-color: var(--mark); } .knob output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.knob .what { grid-column: 1 / -1; margin-top: -0.4rem; font-size: 0.75rem; color: var(--ink-soft); }
iframe { width: 377px; max-width: 100%; height: 900px; border: 1px solid var(--rule); border-radius: 18px; background: #fff; display: block; }
</style>
<div class="wrap">
  <header class="head">
    <h1>验讫动效演示</h1>
    <p>底子是真实《验讫》局内画面,封面已换成新图。右边按钮触发三样渗入的动效,滑杆调时长;钟鸣那一圈金色只是示意(真实的钟鸣是修仙皮肤原有的,不改)。</p>
  </header>
  <div class="bench">
    <div class="stageCol"><iframe id="f" title="《验讫》局内画面"></iframe></div>
    <aside class="notes">
      <div class="box">
        <h2>触发</h2>
        <div class="btns">
          <button type="button" data-cmd="bell">境界跨档:钟鸣 → 压印</button>
          <button type="button" data-cmd="reset">撤掉印</button>
          <button type="button" data-cmd="bleed">字洇一次</button>
          <button type="button" data-lv="1">窥天 → 未觉</button>
          <button type="button" data-lv="2">窥天 → 见格</button>
          <button type="button" data-lv="3">窥天 → 知渔</button>
        </div>
      </div>
      <div class="box"><h2>时长</h2><div class="knobs" id="knobs"></div></div>
      <div class="box">
        <h2>这一版的动效</h2>
        <ul>
          <li><b>压印</b>:钟响后停一会儿,印从稍大一点「落」下来,越落越快,压到底轻轻一顿(缩到 0.96 再回 1)。之后一直留着。</li>
          <li><b>字洇</b>:一个字从中心晕开一团淡墨,字也变成墨绿;停一下,再慢慢收回。一屏最多一个。</li>
          <li><b>墨洇加深</b>:窥天跨档时,水渍慢慢变深变大(这里点按钮切档),不跳、不闪。</li>
          <li>系统开了「减少动态效果」:印直接出现、字洇直接换色、墨洇直接到位。</li>
        </ul>
      </div>
    </aside>
  </div>
</div>

" cy=\"58\" r=\"1.6\"/><circle cx=\"80\" cy=\"77\" r=\"1.9\"/><\/svg>满门道贺的声音还没散尽,你已经站在飞升台下。台心那方青石被人擦得发亮,石面上有一圈细小的<span class=\"yqBleed yqBleedPlain\">印<\/span>文,你从前只当是祝词。今夜月色很低,你蹲下身,用指腹顺着印文摸过去——笔画是反的,像是专门留给从上往下看的人读。丹房的师兄提着灯过来,说掌门请你明日辰时登台。<\/div><div class=\"_notice_1a8y2_429\">已从上次落笔处接续(第 19 回合)<\/div><div class=\"_slips_1lfyl_623\"><button type=\"button\" class=\"_slip_1lfyl_623\"><span class=\"_slipText_1lfyl_693\">照掌门的吩咐,明日辰时登台。<\/span><span class=\"_slipHint_1lfyl_698\">顺水推舟,众人都在看着你。<\/span><\/button><button type=\"button\" class=\"_slip_1lfyl_623\"><span class=\"_slipText_1lfyl_693\">连夜把台心的印文拓下来,对照丹房的旧档。<\/span><span class=\"_slipHint_1lfyl_698\">看得越清楚,越难再装作没看见。<\/span><\/button><button type=\"button\" class=\"_slip_1lfyl_623\"><span class=\"_slipText_1lfyl_693\">回房调息,把今夜的事先放一放。<\/span><span class=\"_slipHint_1lfyl_698\">清明能稳住一些,但时辰不等人。<\/span><\/button><\/div><section class=\"_rules_1a8y2_331\"><h2 class=\"_rulesTitle_1a8y2_338\">规则须知<\/h2><ol class=\"_ruleList_1a8y2_343\"><li class=\"_rule_1a8y2_331 _ruleDiscovered_1a8y2_364\">登台之前,不可回看来路。<span class=\"_ruleTag_1a8y2_415\">已验证<\/span><\/li><li class=\"_rule_1a8y2_331 _ruleDiscovered_1a8y2_364\">印文只许拓,不许念。<span class=\"_ruleTag_1a8y2_415\">已验证<\/span><\/li><li class=\"_rule_1a8y2_331\">丹房夜里不点灯。<\/li><\/ol><\/section><\/main><\/div><script>\n(function(){\n  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var stamp = document.querySelector('.yqStamp'), seal = document.querySelector('.yqSeal'), bleed = document.querySelector('.yqBleed');\n  seal.style.position = 'relative';\n  var P = {};\n  window.addEventListener('message', function(e){\n    var m = e.data || {}; P = m.p || P;\n    document.body.style.setProperty('--seepMs', P.seep + 'ms');\n    document.body.style.setProperty('--bin', P.bin + 'ms'); document.body.style.setProperty('--bout', P.bout + 'ms');\n    if (m.cmd === 'level') { document.body.className = 'lv' + m.v; }\n    if (m.cmd === 'bell') bell();\n    if (m.cmd === 'bleed')
